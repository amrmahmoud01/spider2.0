name: Deploy Scrapy Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install setuptools wheel

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SCRAPYD_USERNAME: ${{ secrets.SCRAPYD_USERNAME }}
          SCRAPYD_PASSWORD: ${{ secrets.SCRAPYD_PASSWORD }}
        run: |
          # 1. Create a minimal setup.py if it doesn't exist
          if [ ! -f setup.py ]; then
            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='spider20', version='0.1', packages=find_packages(), entry_points={'scrapy': ['settings = spider20.settings']})" >> setup.py
          fi

          # 2. Build the egg
          python3 setup.py bdist_egg

          # 3. Deploy via CURL directly to the open authenticated port
          EGG_FILE=$(ls dist/*.egg | head -n 1)
          curl -u "$SCRAPYD_USERNAME:$SCRAPYD_PASSWORD" http://$SERVER_IP:6800/addversion.json -F project=spider20 -F version=${{ github.sha }} -F egg=@$EGG_FILE