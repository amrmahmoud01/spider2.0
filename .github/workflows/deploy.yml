name: Deploy Scrapy Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install scrapyd-client
          
      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          # 1. Setup SSH Identity
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Generate the config file the tool expects
          echo "[settings]" > scrapy.cfg
          echo "default = spider20.settings" >> scrapy.cfg
          echo "[deploy]" >> scrapy.cfg
          echo "url = http://127.0.0.1:6800/" >> scrapy.cfg
          echo "project = spider20" >> scrapy.cfg
          
          # 3. Establish the tunnel in the background
          # -o StrictHostKeyChecking=no avoids interactive prompts
          # -f runs in background, -N keeps tunnel open
          ssh -o StrictHostKeyChecking=no -f -N -L 6800:127.0.0.1:6800 root@$SERVER_IP -i ~/.ssh/id_rsa
          
          # 4. Deploy
          scrapyd-deploy spider20name: Deploy Scrapy Project

