name: Deploy Scrapy Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to v5
        with:
          python-version: '3.11'     # Matched your Dockerfile Python version

      - name: Install dependencies
        run: |
          pip install setuptools wheel

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          # 1. Setup SSH Identity
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Dynamically get the internal Docker container IP 
          # (Replace 'spider20' with your actual Coolify container name prefix if needed)
          CONTAINER_IP=$(ssh -o StrictHostKeyChecking=no root@$SERVER_IP -i ~/.ssh/id_rsa "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \$(docker ps -q --filter name=spider20)")
          echo "Found container internal IP: $CONTAINER_IP"

          # 3. Establish the tunnel directly to the container's IP
          ssh -o StrictHostKeyChecking=no -f -N -L 6800:$CONTAINER_IP:6800 root@$SERVER_IP -i ~/.ssh/id_rsa
          
          # 4. Create a minimal setup.py if it doesn't exist
          if [ ! -f setup.py ]; then
            echo "from setuptools import setup, find_packages" > setup.py
            echo "setup(name='spider20', version='0.1', packages=find_packages(), entry_points={'scrapy': ['settings = spider20.settings']})" >> setup.py
          fi
          
          # 5. Build the egg
          python3 setup.py bdist_egg
          
          # 6. Deploy via CURL using GitHub Commit SHA as the version
          EGG_FILE=$(ls dist/*.egg | head -n 1)
          curl http://127.0.0.1:6800/addversion.json \
            -F project=spider20 \
            -F version=${{ github.sha }} \
            -F egg=@$EGG_FILE

          # 7. Clean up the background tunnel
          pkill -f "ssh -o StrictHostKeyChecking=no -f -N"